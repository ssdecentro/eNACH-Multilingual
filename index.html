<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>eNACH Multilingual UI Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── ShadCN token layer ─────────────────────────────────────────── */
:root{
  --background:0 0% 100%;
  --foreground:222.2 84% 4.9%;
  --card:0 0% 100%;
  --card-foreground:222.2 84% 4.9%;
  --popover:0 0% 100%;
  --popover-foreground:222.2 84% 4.9%;
  --primary:204 100% 50%;          /* Decentro blue #0092ff */
  --primary-foreground:0 0% 100%;
  --secondary:210 40% 96.1%;
  --secondary-foreground:222.2 47.4% 11.2%;
  --muted:210 40% 96.1%;
  --muted-foreground:215.4 16.3% 46.9%;
  --accent:204 100% 97%;
  --accent-foreground:222.2 47.4% 11.2%;
  --destructive:0 84.2% 60.2%;
  --destructive-foreground:0 0% 98%;
  --success:142 71% 45%;
  --border:214.3 31.8% 91.4%;
  --input:214.3 31.8% 91.4%;
  --ring:204 100% 50%;
  --radius:0.75rem;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#0b1220;
  color:hsl(var(--foreground));
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
/* script-aware font stacks, applied by data-locale on the stream root */
[data-script="deva"]{font-family:"Inter","Noto Sans Devanagari",sans-serif}
[data-script="beng"]{font-family:"Inter","Noto Sans Bengali",sans-serif}
[data-script="gujr"]{font-family:"Inter","Noto Sans Gujarati",sans-serif}
[data-script="guru"]{font-family:"Inter","Noto Sans Gurmukhi",sans-serif}
[data-script="knda"]{font-family:"Inter","Noto Sans Kannada",sans-serif}
[data-script="mlym"]{font-family:"Inter","Noto Sans Malayalam",sans-serif}
[data-script="orya"]{font-family:"Inter","Noto Sans Oriya",sans-serif}
[data-script="taml"]{font-family:"Inter","Noto Sans Tamil",sans-serif}
[data-script="telu"]{font-family:"Inter","Noto Sans Telugu",sans-serif}
[data-script="arab"]{font-family:"Noto Nastaliq Urdu","Inter",serif;line-height:2.1}
[data-script="arab"] .tabular{font-family:"Inter",sans-serif;line-height:1.4}

/* ── stage ──────────────────────────────────────────────────────── */
.stage{
  height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(10px,2.4vh,28px) clamp(12px,4vw,24px);
  overflow:hidden;
  background:
    radial-gradient(120% 80% at 10% 0%,#4aa8ff 0%,rgba(74,168,255,0) 55%),
    radial-gradient(100% 90% at 100% 10%,#5fd4d6 0%,rgba(95,212,214,0) 50%),
    linear-gradient(160deg,#1f6fe0 0%,#2f8ae8 40%,#36a9d8 100%);
  background-attachment:fixed;
}
/* column that owns the viewport budget: card shrinks, strip never does */
.shell{
  width:100%;max-width:468px;height:100%;min-height:0;
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:10px;
}
.stream{
  width:100%;flex:0 1 auto;min-height:0;
  background:hsl(var(--card));
  border-radius:20px;
  box-shadow:0 24px 60px -12px rgba(8,30,70,.38),0 4px 14px rgba(8,30,70,.14);
  overflow:visible;
  display:flex;flex-direction:column;
  animation:rise .35s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[dir="rtl"] .stream{direction:rtl;text-align:right}

/* ── stream chrome ──────────────────────────────────────────────── */
.stream-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px 12px;flex:none;border-radius:20px 20px 0 0;background:hsl(var(--card));
}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px;min-width:0}
.meta dt{color:hsl(var(--muted-foreground));white-space:nowrap}
.meta dd{margin:0;font-weight:600;color:hsl(var(--foreground));overflow:hidden;text-overflow:ellipsis}
.merchant-bar{
  flex:none;
  display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
  background:hsl(var(--muted));
  padding:9px 16px;font-size:12.5px;color:hsl(var(--muted-foreground));
  text-align:center;
}
.merchant-logo{
  display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12.5px;
  direction:ltr;unicode-bidi:isolate;
  letter-spacing:.2px;font-family:"Inter",sans-serif;color:#1b2b4b;white-space:nowrap;
}
.merchant-logo img{height:17px;width:auto;max-width:104px;object-fit:contain;display:block}
.stream-body{
  padding:16px 18px 4px;
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:hsl(var(--border)) transparent;
}
.stream-body::-webkit-scrollbar{width:7px}
.stream-body::-webkit-scrollbar-thumb{background:hsl(var(--border));border-radius:99px}
.stream-body::-webkit-scrollbar-track{background:transparent}
.stream-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px 18px;flex:none;
  border-radius:0 0 20px 20px;background:hsl(var(--card));
  border-top:1px solid hsl(var(--border));
}
.actions{display:flex;gap:10px;align-items:center;margin-inline-start:auto}
[dir="rtl"] .actions{margin-inline-start:auto}

/* ── title ──────────────────────────────────────────────────────── */
.title{
  font-size:17px;font-weight:700;text-align:center;margin:2px 0 16px;
  color:hsl(var(--foreground));letter-spacing:-.01em;
}
.subtitle{font-size:13px;color:hsl(var(--muted-foreground));text-align:center;margin:-10px 0 16px}

/* ── shadcn: label / input / select ─────────────────────────────── */
.field{margin-bottom:14px}
.label{
  display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;
  color:hsl(var(--foreground));line-height:1.45;
}
.req{color:hsl(var(--destructive));margin-inline-start:2px}
.input,.select{
  width:100%;height:42px;border-radius:calc(var(--radius) - 2px);
  border:1px solid hsl(var(--input));background:hsl(var(--background));
  padding:0 12px;font-size:13.5px;font-family:inherit;color:hsl(var(--foreground));
  transition:border-color .15s,box-shadow .15s;outline:none;
}
[dir="rtl"] .input,[dir="rtl"] .select{text-align:right}
.input::placeholder{color:hsl(var(--muted-foreground));opacity:.85}
.input:focus,.select:focus,.combo-trigger:focus-visible{
  border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring)/.18);
}
.input[aria-invalid="true"]{border-color:hsl(var(--destructive))}
.input:disabled{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.select{
  appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;
}
[dir="rtl"] .select{background-position:left 12px center;padding-right:12px;padding-left:34px}
.hint{font-size:11.5px;color:hsl(var(--muted-foreground));margin-top:5px;line-height:1.5}
.err{font-size:11.5px;color:hsl(var(--destructive));margin-top:5px;font-weight:500}
.prefix-wrap{display:flex;align-items:center;gap:0}
.prefix{
  height:42px;display:flex;align-items:center;padding:0 10px;font-size:13px;
  direction:ltr;unicode-bidi:isolate;
  border:1px solid hsl(var(--input));background:hsl(var(--muted));
  color:hsl(var(--muted-foreground));font-family:"Inter",sans-serif;
  border-radius:calc(var(--radius) - 2px) 0 0 calc(var(--radius) - 2px);border-inline-end:0;
}
[dir="rtl"] .prefix{border-radius:0 calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0}
.prefix-wrap .input{border-radius:0 calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0}
[dir="rtl"] .prefix-wrap .input{border-radius:calc(var(--radius) - 2px) 0 0 calc(var(--radius) - 2px)}

/* latin-only fields keep Inter + LTR even in RTL layouts */
.latin{font-family:"Inter",sans-serif;direction:ltr;text-align:left}

/* ── shadcn: button ─────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  font-family:inherit;cursor:pointer;border:1px solid transparent;
  transition:background .15s,box-shadow .15s,opacity .15s,transform .08s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px hsl(var(--ring)/.35)}
.btn-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.btn-primary:hover{background:hsl(var(--primary)/.9)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border-color:hsl(var(--input));color:hsl(var(--foreground))}
.btn-outline:hover{background:hsl(var(--muted))}
.btn-ghost{background:transparent;color:hsl(var(--muted-foreground));height:34px;padding:0 10px}
.btn-ghost:hover{background:hsl(var(--muted))}
.btn-block{width:100%}

/* ── shadcn: collapsible card (Optional Details) ────────────────── */
.collapsible{
  border:1px solid hsl(var(--primary)/.35);border-radius:var(--radius);
  background:linear-gradient(180deg,hsl(var(--accent)) 0%,hsl(var(--background)) 100%);
  overflow:hidden;margin-bottom:4px;
}
.collapsible-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:transparent;border:0;cursor:pointer;padding:12px 14px;
  font-size:13px;font-weight:600;color:hsl(var(--foreground));font-family:inherit;
}
.collapsible-trigger svg{transition:transform .2s;flex:none;color:hsl(var(--muted-foreground))}
.collapsible[data-open="false"] .collapsible-trigger svg{transform:rotate(-90deg)}
[dir="rtl"] .collapsible[data-open="false"] .collapsible-trigger svg{transform:rotate(90deg)}
.collapsible-content{padding:0 14px 12px}
.collapsible[data-open="false"] .collapsible-content{display:none}
.opt-row{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.opt-row:last-child{margin-bottom:0}
.opt-row .label{margin:0}
@media (max-width:400px){.opt-row{grid-template-columns:1fr;gap:5px}}

/* ── language dropdown ──────────────────────────────────────────── */
.lang{position:relative;flex:none}
.lang-trigger{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;
  border-radius:999px;border:1px solid hsl(var(--input));background:hsl(var(--background));
  font-size:12.5px;font-weight:600;font-family:inherit;color:hsl(var(--foreground));cursor:pointer;
  max-width:148px;transition:border-color .15s,box-shadow .15s;
}
.lang-trigger:hover{border-color:hsl(var(--primary)/.5)}
.lang-trigger:focus-visible{outline:none;box-shadow:0 0 0 3px hsl(var(--ring)/.25)}
.lang-trigger .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-trigger svg{flex:none;transition:transform .2s;color:hsl(var(--muted-foreground))}
.lang[data-open="true"] .lang-trigger svg{transform:rotate(180deg)}
.lang-menu{
  position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:40;
  width:208px;max-height:min(290px,48dvh);overflow-y:auto;overscroll-behavior:contain;
  background:hsl(var(--popover));border:1px solid hsl(var(--border));
  border-radius:var(--radius);padding:5px;
  box-shadow:0 12px 32px -6px rgba(8,30,70,.26),0 2px 8px rgba(8,30,70,.1);
  animation:pop .14s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.lang[data-open="false"] .lang-menu{display:none}
.lang-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  background:transparent;border:0;cursor:pointer;border-radius:8px;
  padding:8px 10px;font-size:13.5px;font-family:inherit;color:hsl(var(--foreground));
  text-align:start;line-height:1.6;
}
.lang-item:hover,.lang-item:focus-visible{background:hsl(var(--accent));outline:none}
.lang-item[aria-selected="true"]{font-weight:600;color:hsl(var(--primary))}
.lang-item .tick{opacity:0;flex:none}
.lang-item[aria-selected="true"] .tick{opacity:1}
.lang-item[data-script="arab"]{font-family:"Noto Nastaliq Urdu",serif;line-height:2.2}

/* ── bank list ──────────────────────────────────────────────────── */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{
  position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  color:hsl(var(--muted-foreground));pointer-events:none;
}
.search-wrap .input{padding-inline-start:36px}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin:4px 0 9px;
}
[data-script="arab"] .section-label{letter-spacing:0;text-transform:none;font-size:12.5px}
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
@media (max-width:380px){.bank-grid{grid-template-columns:repeat(2,1fr)}}
.bank-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:12px 6px;border:1px solid hsl(var(--border));border-radius:var(--radius);
  background:hsl(var(--background));cursor:pointer;font-family:inherit;
  transition:border-color .15s,background .15s,box-shadow .15s;min-height:84px;
}
.bank-tile:hover{border-color:hsl(var(--primary)/.55);background:hsl(var(--accent))}
.bank-tile:focus-visible{outline:none;box-shadow:0 0 0 3px hsl(var(--ring)/.25)}
.bank-tile span{font-size:11px;font-weight:600;text-align:center;line-height:1.3;color:hsl(var(--foreground))}
.bank-list{margin:0 -4px;padding:0 4px}
.bank-row{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 10px;border:0;border-radius:10px;background:transparent;
  cursor:pointer;font-family:inherit;text-align:start;transition:background .12s;
}
.bank-row:hover{background:hsl(var(--accent))}
.bank-row:focus-visible{outline:none;background:hsl(var(--accent));box-shadow:0 0 0 2px hsl(var(--ring)/.3)}
.bank-row .nm{font-size:13.5px;font-weight:500;color:hsl(var(--foreground))}
.bank-mark{
  width:32px;height:32px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;font-family:"Inter",sans-serif;letter-spacing:-.02em;
}
.empty{text-align:center;padding:26px 10px;color:hsl(var(--muted-foreground));font-size:13px}
.not-listed{
  text-align:center;font-size:12.5px;color:hsl(var(--muted-foreground));
  padding:12px 4px 2px;border-top:1px solid hsl(var(--border));margin-top:10px;line-height:1.7;
}
.not-listed a{color:hsl(var(--primary));font-weight:600;text-decoration:none;cursor:pointer}
.not-listed a:hover{text-decoration:underline}

/* ── review rows ────────────────────────────────────────────────── */
.review{border:1px solid hsl(var(--border));border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.review-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:11px 14px;border-bottom:1px solid hsl(var(--border));font-size:13px;
}
.review-row:last-child{border-bottom:0}
.review-row dt{color:hsl(var(--muted-foreground));flex:none}
.review-row dd{margin:0;font-weight:600;text-align:end;color:hsl(var(--foreground));word-break:break-word}
.tabular{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums}

/* ── auth + success ─────────────────────────────────────────────── */
.center-state{text-align:center;padding:26px 8px 18px}
.orb{
  width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;
}
.orb-success{background:hsl(var(--success)/.12);color:hsl(var(--success))}
.orb-bank{background:hsl(var(--primary)/.12);color:hsl(var(--primary))}
.orb-warn{background:hsl(var(--destructive)/.1);color:hsl(var(--destructive))}
.spinner{
  width:40px;height:40px;border-radius:50%;margin:0 auto 18px;
  border:3px solid hsl(var(--primary)/.18);border-top-color:hsl(var(--primary));
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.umrn{
  display:inline-block;margin-top:12px;padding:9px 16px;border-radius:10px;
  background:hsl(var(--muted));font-family:"Inter",sans-serif;font-weight:700;
  font-size:14px;letter-spacing:.06em;color:hsl(var(--foreground));
}

/* ── footer brand ───────────────────────────────────────────────── */
.brand{display:flex;flex-direction:column;gap:4px;flex:none}
.stream-foot[data-center="true"]{justify-content:center}
.decentro-lockup{display:flex;align-items:center;gap:5px;direction:ltr;unicode-bidi:isolate}

/* ── progress dots ──────────────────────────────────────────────── */
.steps{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 0 12px}
.steps i{width:6px;height:6px;border-radius:50%;background:hsl(var(--border));transition:all .25s}
.steps i[data-on="true"]{background:hsl(var(--primary));width:18px;border-radius:999px}

/* ── link status strip ──────────────────────────────────────────── */
.link-strip{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  flex:none;margin:0;padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.26);color:#fff;font-size:11.5px;font-weight:500;
}
.link-strip .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex:none}
.link-strip.expired .dot{background:#f87171}

/* phones and very short viewports: page scrolls, card keeps natural height */
@media (max-width:640px),(max-height:560px){
  .stage{height:auto;min-height:100dvh;align-items:flex-start;overflow:visible}
  .shell{height:auto;justify-content:flex-start}
  .stream{flex:0 0 auto}
  .stream-body{overflow:visible;min-height:auto}
  .lang-menu{max-height:min(290px,60dvh)}
}

/* ── developer console ──────────────────────────────────────────── */
.console-fab{
  position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:60;
  display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;
  border-radius:999px;border:1px solid rgba(255,255,255,.2);
  background:#0b1220;color:#fff;font-family:"Inter",sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.3);
}
.console-fab:hover{background:#17233c}
.console{
  position:fixed;inset-block:0;inset-inline-end:0;z-index:70;width:min(432px,100vw);
  background:#0b1220;color:#dbe4f3;display:flex;flex-direction:column;
  border-inline-start:1px solid rgba(255,255,255,.1);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;direction:ltr;
}
.console[data-open="true"]{transform:none}
@media (max-width:520px){
  .console{inset-block-start:auto;height:76dvh;width:100vw;border-radius:18px 18px 0 0;
    transform:translateY(100%);border-inline-start:0;border-top:1px solid rgba(255,255,255,.1)}
  .console[data-open="true"]{transform:none}
}
.console-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);flex:none;
}
.console-head strong{font-family:"Inter",sans-serif;font-size:13.5px;color:#fff;letter-spacing:.01em}
.console-close{
  background:transparent;border:0;color:#8fa3c4;cursor:pointer;padding:4px;border-radius:6px;display:flex;
}
.console-close:hover{background:rgba(255,255,255,.08);color:#fff}
.console-tabs{display:flex;gap:4px;padding:10px 12px 0;flex:none}
.console-tab{
  background:transparent;border:0;border-radius:7px 7px 0 0;color:#8fa3c4;cursor:pointer;
  padding:8px 12px;font-family:"Inter",sans-serif;font-size:12px;font-weight:600;
}
.console-tab[aria-selected="true"]{background:rgba(255,255,255,.07);color:#fff}

/* t(key, vars) — resolves a full-sentence template.
   Placeholders are substituted into the translated sentence, never
   appended to it, so word order stays correct in every language. */
const t = (key, vars) => {
  let s = (S[state.locale] && S[state.locale][key]) ?? S.en[key] ?? key;
  if (vars) for (const k in vars) s = s.replaceAll("{" + k + "}", vars[k]);
  return s;
};

/* ═══════════════════════════════════════════════════════════════════
   5 · LOCALE RESOLUTION + SWITCHING
   Switching is a pure in-memory re-render: no reload, no history
   entry, no URL change, no new network call. The link token and its
   15-minute window are untouched.
   ═══════════════════════════════════════════════════════════════════ */
const localeMeta = code => LOCALES.find(l => l.code === code) || LOCALES[0];

function applyLocaleChrome(){
  const m = localeMeta(state.locale);
  const stream = document.getElementById("stream");
  stream.setAttribute("data-script", m.script);
  stream.setAttribute("dir", m.dir);
  stream.setAttribute("lang", m.code);
  document.documentElement.setAttribute("lang", m.code);
}

function setLocale(code, source){
  if (code === state.locale) { closeLangMenu(); return; }
  const prev = state.locale;
  state.locale = code;
  state.localeSource = source;
  log(`Language switched <b>${prev} → ${code}</b>`, { source, reload:false, url_changed:false, link_token:"unchanged" });
  closeLangMenu();
  render();                                  /* re-render in place */
}

/* merchant payload → initial locale. Falls back to English. */
function resolveInitialLocale(){
  const sent = state.merchantLanguage;
  const supported = LOCALES.some(l => l.code === sent);
  state.locale = supported ? sent : "en";
  state.localeSource = (sent && sent !== "en") ? (supported ? "merchant" : "default") : (sent === "en" ? "merchant" : "default");
  if (sent && !supported) log(`Unsupported <b>language_code "${sent}"</b> — fell back to en`);
}

/* ═══════════════════════════════════════════════════════════════════
   6 · INPUT HANDLING RULES
   ═══════════════════════════════════════════════════════════════════ */
const SANITISE = {
  /* Name: Latin letters, spaces and . ' - only. Indic input is dropped. */
  name: v => v.replace(/[^A-Za-z .'\-]/g, ""),
  /* Account & mobile: Indic digits folded to 0–9, everything else dropped. */
  acc:  v => toAsciiDigits(v).replace(/\D/g, "").slice(0, 18),
  mobile: v => toAsciiDigits(v).replace(/\D/g, "").slice(0, 10),
  /* PAN: Latin letters + digits, forced uppercase. */
  pan:  v => toAsciiDigits(v).replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 10),
  email: v => v.replace(/\s/g, "")
};

const VALIDATE = {
  name: v => !v ? "reqErr" : (/[^A-Za-z .'\-]/.test(v) ? "nameErr" : null),
  acc:  v => !v ? "reqErr" : (v.length < 6 ? "accErr" : null),
  accType: v => !v ? "reqErr" : null,
  auth: v => !v ? "reqErr" : null,
  pan:  v => !v ? null : (/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(v) ? null : "panErr"),
  mobile: v => !v ? null : (/^[6-9][0-9]{9}$/.test(v) ? null : "mobErr")
};

const decentroLockup = (tone = "black") => {
  const ink = tone === "white" ? "#fff" : "#000";
  return `
  <span class="decentro-lockup">
    <svg viewBox="120.6 120.62 2508.51 297.05" height="13" width="109.8" role="img" aria-label="Decentro">
      ${DECENTRO_PATHS.map(d => `<path d="${d}" fill="${ink}"/>`).join("")}
      <rect x="120.6" y="357.11" width="60.28" height="60.28" fill="#0092ff"/>
    </svg>
  </span>`;
};

/* Full-sentence template → HTML, with the {cancel_link} slot rendered
   as an anchor. The sentence is never split into fragments. */
function sentenceWithLink(key, slot, linkText, linkId){
  const raw = t(key, {});
  const parts = raw.split("{" + slot + "}");
  const a = `<a id="${linkId}" role="button" tabindex="0">${esc(linkText)}</a>`;
  return parts.length === 2 ? esc(parts[0]) + a + esc(parts[1]) : esc(raw) + " " + a;
}

const fmtDate = d => `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;

/* ═══════════════════════════════════════════════════════════════════
   8 · LANGUAGE DROPDOWN
   Shown on the first screen of each flow only:
     flow A (no user details) → bank selection screen
     flow B (user details)    → registration form
   ═══════════════════════════════════════════════════════════════════ */
let langOpen = false;
/* The selector is available on every screen of the stream, so the user can
   change language at any point in the journey, not only on entry. */
function langDropdown(){
  const cur = localeMeta(state.locale);
  const items = LOCALES.map(l => `
    <button class="lang-item" role="option" data-lang="${l.code}" data-script="${l.script}"
            aria-selected="${l.code === state.locale}" lang="${l.code}" dir="${l.dir}">
      <span>${esc(l.name)}</span>${ICON.tick}
    </button>`).join("");
  return `
    <div class="lang" id="langRoot" data-open="${langOpen}">
      <button class="lang-trigger" id="langTrigger" aria-haspopup="listbox"
              aria-expanded="${langOpen}" aria-label="${esc(t("language"))}">
        ${ICON.globe}<span class="name" data-script="${cur.script}">${esc(cur.name)}</span>${ICON.chevron}
      </button>
      <div class="lang-menu" role="listbox" aria-label="${esc(t("language"))}">${items}</div>
    </div>`;
}
const closeLangMenu = () => { langOpen = false; const r = document.getElementById("langRoot"); if (r){ r.dataset.open = "false"; r.querySelector(".lang-trigger").setAttribute("aria-expanded","false"); } };

/* ═══════════════════════════════════════════════════════════════════

function headMeta(){
  const rows = [`<dt>${esc(t("date"))}</dt><dd class="tabular">${fmtDate(new Date())}</dd>`];
  if (state.bank) rows.push(`<dt>${esc(t("bank"))}</dt><dd>${esc(state.bank.name)}</dd>`);
  return `<dl class="meta">${rows.join("")}</dl>`;
}

const merchantBar = () => {
  const raw = t("issuingTo", {});
  const logo = state.merchantLogo
    ? `<span class="merchant-logo"><img src="${esc(state.merchantLogo)}" alt="${esc(state.merchantName)}"></span>`
    : `<span class="merchant-logo">${esc(state.merchantName)}</span>`;
  const parts = raw.split("{merchant_name}");
  const bar = parts.length === 2 ? esc(parts[0]) + logo + esc(parts[1]) : esc(raw) + logo;
  return `<div class="merchant-bar">${bar}</div>`;
};

const stepsDots = () => {
  const seq = ["form","review","success"];
  const i = seq.indexOf(state.step === "redirect" ? "review" : state.step);
  return `<div class="steps">${seq.map((_,n)=>`<i data-on="${n<=i}"></i>`).join("")}</div>`;
};

  const matched = q ? BANKS.filter(b => b.name.toLowerCase().includes(q) || b.short.toLowerCase().includes(q)) : BANKS;
  const mark = b => `<span class="bank-mark" style="background:${b.color}">${esc(b.short.slice(0,4))}</span>`;
  const popular = !q ? `
    <div class="section-label">${esc(t("popular"))}</div>
    <div class="bank-grid">${BANKS.filter(b=>b.popular).map(b=>`
      <button class="bank-tile" data-bank="${b.id}">${mark(b)}<span>${esc(b.name)}</span></button>`).join("")}</div>` : "";
  const list = matched.length ? matched.map(b => `
    <button class="bank-row" data-bank="${b.id}">${mark(b)}<span class="nm">${esc(b.name)}</span></button>`).join("")
    : `<div class="empty">${esc(t("noBanks"))}</div>`;
  return `
    ${stepsDots()}

}

/* ═══════════════════════════════════════════════════════════════════
   10 · ROOT RENDER
   ═══════════════════════════════════════════════════════════════════ */
function render(){
  applyLocaleChrome();
  const stream = document.getElementById("stream");
  const showChrome = true;   /* language selector is available on every screen */
  const showFooterActions = ["bank","form","review"].includes(state.step);

  const body = {
    bank: screenBank, form: screenForm, review: screenReview,
    redirect: screenRedirect, success: screenSuccess, expired: screenExpired
  }[state.step]();

  const primaryLabel = state.step === "review" ? t("proceedBank") : t("confirm");

  stream.innerHTML = `
    ${showChrome ? `<div class="stream-head">${headMeta()}${langDropdown()}</div>` : ""}
    ${showChrome ? merchantBar() : ""}
    <div class="stream-body">${body}</div>
    <div class="stream-foot"${state.step === "success" ? ' data-center="true"' : ''}>
      <div class="brand">
        ${decentroLockup()}
      </div>
      ${showFooterActions ? `<div class="actions">
        ${state.step === "review" ? `<button class="btn btn-outline" id="btnBack">${esc(t("back"))}</button>` : ""}
        ${state.step !== "bank" ? `<button class="btn btn-primary" id="btnNext">${esc(primaryLabel)}</button>` : ""}
      </div>` : ""}
    </div>`;

  bindStream();
  renderConsole();
  renderLinkStrip();
}

/* ═══════════════════════════════════════════════════════════════════
   11 · EVENT BINDING
   ═══════════════════════════════════════════════════════════════════ */
function bindStream(){
  const $ = s => document.getElementById(s);

  /* language dropdown */
  const trig = $("langTrigger");
  if (trig){
    trig.onclick = e => {
      e.stopPropagation();
      langOpen = !langOpen;
      const r = $("langRoot");
      r.dataset.open = langOpen;
      trig.setAttribute("aria-expanded", langOpen);
    };
    document.querySelectorAll(".lang-item").forEach(b => {
      b.onclick = e => { e.stopPropagation(); setLocale(b.dataset.lang, "user"); };
    });
  }

  /* bank search + selection */
  const search = $("bankSearch");
  if (search){
    search.oninput = e => {
      /* bank names are English — search matches the English master only */
      state.bankQuery = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const s2 = $("bankSearch");
      if (s2){ s2.focus(); s2.setSelectionRange(pos, pos); }
    };
  }
  document.querySelectorAll("[data-bank]").forEach(el => {
    el.onclick = () => {
      state.bank = BANKS.find(b => b.id === el.dataset.bank);
      state.step = "form";
      state.bankQuery = "";
      log(`Bank selected <b>${state.bank.name}</b>`, { ifsc_prefix: state.bank.id });
      render();
    };
  });
  const cancel = $("cancelMandate");
  if (cancel) cancel.onclick = () => log("User tapped <b>cancel mandate</b> link");

  /* form inputs — sanitised on every keystroke */
  document.querySelectorAll("[data-k]").forEach(el => {
    const k = el.dataset.k;
    if (el.tagName === "SELECT"){
      el.onchange = () => { state.form[k] = el.value; delete state.errors[k]; renderConsole(); };
      return;
    }
    el.oninput = e => {
      const before = e.target.value;
      const after = SANITISE[k] ? SANITISE[k](before) : before;
      if (after !== before){
        const pos = Math.max(0, e.target.selectionStart - (before.length - after.length));
        e.target.value = after;
        e.target.setSelectionRange(pos, pos);
        if (k === "acc" || k === "mobile") log(`Indic digits normalised in <b>${k}</b>`, { from: before, to: after });
      }
      state.form[k] = after;
      if (state.errors[k]){ delete state.errors[k]; const n = el.parentElement.querySelector(".err"); if (n) n.remove(); el.setAttribute("aria-invalid","false"); }
      renderConsole();
    };
  });

  /* optional details collapsible */
  const ot = $("optionalTrigger");
  if (ot) ot.onclick = () => { state.optionalOpen = !state.optionalOpen; render(); };

  /* footer */
  const back = $("btnBack");
  if (back) back.onclick = () => {
    if (state.step === "review") state.step = "form";
    render();
  };
  const next = $("btnNext");
  if (next) next.onclick = onPrimary;
}

function onPrimary(){
  if (state.step === "form"){
    state.errors = {};
    ["name","acc","accType","auth","pan","mobile"].forEach(k => {
      const e = VALIDATE[k] ? VALIDATE[k](state.form[k]) : null;
      if (e) state.errors[k] = e;
    });
    if (Object.keys(state.errors).length){
      log("Validation failed", state.errors);
      render();
      return;
    }
    state.step = "review";
    log("Mandate details captured");
    render();
    return;
  }
  if (state.step === "review"){
    state.step = "redirect";
    state.linkConsumed = true;
    log("Link consumed — handing off to bank for authentication", { single_use:true });
    render();
    setTimeout(() => {
      state.umrn = "HDFC" + Math.random().toString().slice(2,13);
      state.step = "success";
      log(`Mandate registered <b>${state.umrn}</b>`);
      render();
    }, 2200);
  }
}

document.addEventListener("click", () => { if (langOpen) closeLangMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && langOpen) closeLangMenu(); });

/* ═══════════════════════════════════════════════════════════════════
   12 · LINK LIFECYCLE  (independent of language switching)
   ═══════════════════════════════════════════════════════════════════ */
function remaining(){ return Math.max(0, LINK_TTL_MS - (Date.now() - state.linkIssuedAt)); }
function mmss(ms){ const s = Math.floor(ms/1000); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }

function renderLinkStrip(){
  const strip = document.getElementById("linkStrip");
  const txt = document.getElementById("linkStripText");
  const ms = remaining();
  const expired = ms === 0;
  strip.classList.toggle("expired", expired);
  txt.textContent = expired
    ? "Single-use link · expired"
    : `Single-use link · ${state.linkConsumed ? "consumed" : "unused"} · expires in ${mmss(ms)}`;
}

setInterval(() => {
  if (!state.linkExpired && remaining() === 0 && !["success"].includes(state.step)){
    state.linkExpired = true;
    state.step = "expired";
    log("Link expired after 15 minutes");
    render();
  }
  renderLinkStrip();
  if (document.getElementById("console").dataset.open === "true") renderConsole();
}, 1000);

/* ═══════════════════════════════════════════════════════════════════
   13 · DEVELOPER CONSOLE
   ═══════════════════════════════════════════════════════════════════ */
const hl = obj => JSON.stringify(obj, null, 2)
  .replace(/"([^"]+)":/g, '<span class="tok-key">"$1"</span>:')
  .replace(/: "([^"]*)"/g, ': <span class="tok-str">"$1"</span>')
  .replace(/: (\d+)/g, ': <span class="tok-num">$1</span>')
  .replace(/: (true|false|null)/g, ': <span class="tok-bool">$1</span>');

let activeTab = "state";

function renderConsole(){
  const m = localeMeta(state.locale);

  /* ── State ── */
  document.querySelector('[data-panel="state"]').innerHTML = `
    <div class="cs-label">Locale resolution</div>
    <div class="kv"><span>Rendered locale</span><span>${m.code} · ${esc(m.name)}</span></div>
    <div class="kv"><span>Source</span><span><span class="pill ${state.localeSource==="user"?"pill-ok":state.localeSource==="merchant"?"pill-warn":"pill-off"}">${state.localeSource}</span></span></div>
    <div class="kv"><span>Merchant language_code</span><span>${esc(state.merchantLanguage || "—")}</span></div>
    <div class="kv"><span>Script / direction</span><span>${m.script} · ${m.dir}</span></div>
    <div class="kv"><span>Supported locales</span><span>${LOCALES.length}</span></div>

    <div class="cs-label">Link</div>
    <div class="kv"><span>Validity</span><span>${remaining()? mmss(remaining()) + " left" : "expired"}</span></div>
    <div class="kv"><span>Single use</span><span><span class="pill ${state.linkConsumed?"pill-err":"pill-ok"}">${state.linkConsumed?"consumed":"unused"}</span></span></div>
    <div class="kv"><span>Page reloads</span><span>0</span></div>
    <div class="kv"><span>URL mutations</span><span>0</span></div>

    <div class="cs-label">Journey</div>
    <div class="kv"><span>Flow</span><span>${state.prefillUserDetails?"details prefilled":"blank form"}</span></div>
    <div class="kv"><span>Step</span><span>${state.step}</span></div>
    <div class="kv"><span>Bank</span><span>${esc(state.bank?state.bank.name:"—")}</span></div>
    <div class="kv"><span>Language selector</span><span><span class="pill pill-ok">every screen</span></span></div>

    <div class="cs-label">Captured input (post-sanitisation)</div>
    <pre>${hl({
      name: state.form.name,
      account_number: state.form.acc,
      account_type: state.form.accType || null,
      authentication_mode: state.form.auth || null,
      pan: state.form.pan || null,
      mobile: state.form.mobile || null
    })}</pre>
    <p class="console-note">Name accepts Latin characters only. Account number and mobile fold Indic digits to 0–9. PAN is uppercased. Bank search matches the English bank master.</p>`;

  /* ── API ── */
  document.querySelector('[data-panel="api"]').innerHTML = `
    <div class="cs-label">1 · Merchant → Decentro · mandate registration</div>
    <pre>${hl({
      reference_id:"ENACH-2026-11-03-00418",
      consumer_urn:"CUST_8831920",
      merchant_name: state.merchantName,
      language_code: state.merchantLanguage,
      maximum_amount: 25000,
      frequency:"MONTHLY",
      purpose:"LOAN_REPAYMENT",
      bank_details: state.prefillUserDetails ? {
        bank_name:"HDFC Bank", account_number:"XXXXXXXX4417", account_holder_name:"RAHUL SHARMA"
      } : null
    })}</pre>
    <p class="console-note"><b>language_code</b> is optional. When absent or unsupported, the UI Stream renders in <b>en</b>.</p>

    <div class="cs-label">2 · Decentro → Merchant · UI Stream link</div>
    <pre>${hl({
      status:"SUCCESS",
      ui_stream_url:"https://enach.decentro.tech/s/7f2a9c41e8",
      language_code: state.locale,
      expires_in_seconds: 900,
      single_use: true
    })}</pre>

    <div class="cs-label">3 · Client-side locale switch (no network call)</div>
    <pre>${hl({
      event:"ui_stream.language_changed",
      from: state.events.filter(e=>e.msg.includes("Language")).length ? "—" : state.merchantLanguage,
      to: state.locale,
      source: state.localeSource,
      reload: false,
      url_changed: false,
      token_invalidated: false
    })}</pre>
    <p class="console-note">The switch re-renders from the in-memory string bundle. No request is made, no history entry is pushed, and the link token and its 15-minute window are untouched.</p>

    <div class="cs-label">4 · Backend error shape (always English)</div>
    <pre>${hl({
      status:"ERROR",
      error_code:"ENACH_BANK_UNREACHABLE",
      message:"Destination bank is not responding. Please retry.",
      localised: false
    })}</pre>
    <p class="console-note">Error codes and messages from the backend stay in English and are not translated on the stream.</p>`;

  /* ── Events ── */
  const logEl = document.getElementById("eventLog");
  logEl.innerHTML = state.events.map(e => `
    <div class="log-row">
      <time>${e.ts.toTimeString().slice(0,8)}</time>
      <div class="msg">${e.msg}${e.detail?`<br><span style="color:#6b82a8">${esc(JSON.stringify(e.detail))}</span>`:""}</div>
    </div>`).join("") || `<p class="console-note">No events yet.</p>`;

  /* ── Simulate ── */
  const panel = document.querySelector('[data-panel="sim"]');
  if (!panel.dataset.built){
    panel.innerHTML = `
      <div class="cs-label">Registration API payload</div>
      <div class="ctrl">
        <label>language_code sent by merchant</label>
        <select id="simLang">
          <option value="">(not sent)</option>
          ${LOCALES.map(l=>`<option value="${l.code}">${l.code} · ${l.name}</option>`).join("")}
          <option value="fr">fr · unsupported (tests fallback)</option>
        </select>
      </div>
      <div class="ctrl">
        <label>merchant_name</label>
        <input id="simMerchant" value="&lt;Merchant&gt;" />
      </div>
      <div class="ctrl">
        <label>merchant logo</label>
        <input id="simLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" />
        <div class="seg" style="margin-top:6px">
          <button id="simLogoClear">Remove logo</button>
        </div>
      </div>
      <div class="ctrl">
        <label>Flow variant</label>
        <div class="seg">
          <button id="simFlowA" aria-pressed="true">Blank form</button>
          <button id="simFlowB" aria-pressed="false">Details prefilled</button>
        </div>
      </div>
      <div class="cs-label">Bank</div>
      <div class="ctrl">
        <label>Destination bank on the mandate</label>
        <select id="simBank">
          ${BANKS.map(b=>`<option value="${b.id}">${b.name}</option>`).join("")}
        </select>
      </div>
      <div class="ctrl">
        <div class="seg">
          <button id="simBankScreen">Open bank selection screen</button>
        </div>
      </div>
      <p class="console-note">The stream opens on the mandate registration form. Change the bank here, or open the selection screen to review it on its own.</p>
      <div class="cs-label">Link lifecycle</div>
      <div class="ctrl">
        <div class="seg">
          <button id="simExpire">Force expiry</button>
          <button id="simReset">Reset timer</button>
        </div>
      </div>
      <button class="restart" id="simRestart">Restart UI Stream with this payload</button>
      <p class="console-note">Restart replays the stream exactly as the merchant's integration would, so the initial locale comes from the payload again.</p>`;
    panel.dataset.built = "1";
    bindSim();
  }
  const sl = document.getElementById("simLang");
  if (sl && document.activeElement !== sl) sl.value = state.merchantLanguage;
  const fa = document.getElementById("simFlowA"), fb = document.getElementById("simFlowB");
  if (fa){ fa.setAttribute("aria-pressed", !state.prefillUserDetails); fb.setAttribute("aria-pressed", state.prefillUserDetails); }
  const sb = document.getElementById("simBank");
  if (sb && document.activeElement !== sb && state.bank) sb.value = state.bank.id;
}

function bindSim(){
  const $ = s => document.getElementById(s);
  $("simLang").onchange = e => { state.merchantLanguage = e.target.value; };
  $("simMerchant").oninput = e => { state.merchantName = e.target.value || DEFAULT_MERCHANT; render(); };
  $("simLogo").onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { state.merchantLogo = r.result; log(`Merchant logo set <b>${esc(f.name)}</b>`); render(); };
    r.readAsDataURL(f);
  };
  $("simLogoClear").onclick = () => {
    state.merchantLogo = null;
    const i = $("simLogo"); if (i) i.value = "";
    log("Merchant logo cleared"); render();
  };
  $("simFlowA").onclick = () => { state.prefillUserDetails = false; renderConsole(); };
  $("simFlowB").onclick = () => { state.prefillUserDetails = true; renderConsole(); };
  $("simBank").onchange = e => {
    state.bank = BANKS.find(b => b.id === e.target.value);
    log(`Bank updated from sidebar <b>${state.bank.name}</b>`, { ifsc_prefix: state.bank.id });
    render();
  };
  $("simBankScreen").onclick = () => { state.step = "bank"; state.bankQuery = ""; render(); };
  $("simExpire").onclick = () => { state.linkIssuedAt = Date.now() - LINK_TTL_MS; };
  $("simReset").onclick = () => {
    state.linkIssuedAt = Date.now(); state.linkExpired = false;
    if (state.step === "expired") state.step = "form";
    log("Link timer reset"); render();
  };
  $("simRestart").onclick = restart;
}

function restart(){
  state.step = "form";
  if (!state.bank) state.bank = BANKS[0];
  state.form = state.prefillUserDetails
    ? { name:"RAHUL SHARMA", acc:"50100244174417", accType:"savings", auth:"", email:"", pan:"", mobile:"" }
    : { name:"", acc:"", accType:"", auth:"", email:"", pan:"", mobile:"" };
  state.errors = {}; state.bankQuery = ""; state.umrn = null;
  state.linkIssuedAt = Date.now(); state.linkConsumed = false; state.linkExpired = false;
  state.events = [];
  resolveInitialLocale();
  log(`UI Stream opened · locale <b>${state.locale}</b> from <b>${state.localeSource}</b>`);
  render();
}

/* console shell */
(function consoleShell(){
  const c = document.getElementById("console"), scrim = document.getElementById("scrim");
  const open = v => {
    c.dataset.open = v; scrim.hidden = !v;
    document.getElementById("consoleFab").setAttribute("aria-expanded", v);
    if (v) renderConsole();
  };
  document.getElementById("consoleFab").onclick = () => open(c.dataset.open !== "true");
  document.getElementById("consoleClose").onclick = () => open(false);
  scrim.onclick = () => open(false);
  document.querySelectorAll(".console-tab").forEach(b => {
    b.onclick = () => {
      activeTab = b.dataset.tab;
      document.querySelectorAll(".console-tab").forEach(x => x.setAttribute("aria-selected", x === b));
      document.querySelectorAll(".console-panel").forEach(p => p.hidden = p.dataset.panel !== activeTab);
      renderConsole();
    };
  });
})();

/* boot */
restart();
</script>
</body>
</html>
